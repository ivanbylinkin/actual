name: Fork - Build image and deploy

# Fork-only workflow (see FORK.md and DEPLOY.md). Builds the sync server image,
# which also serves the web client, pushes it to GHCR and then asks Coolify to
# deploy it. Coolify must not build the image itself: the client build needs
# about 8 GB of memory.

on:
  push:
    branches:
      - master
  workflow_dispatch:

# A newer push supersedes an older build that is still running, so the image
# that ends up deployed is always the latest commit's.
concurrency:
  group: fork-docker
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # GHCR image names must be lowercase; owner and repo names may not be.
      - name: Work out the image name
        id: image
        run: |
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/$repository" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: sync-server.Dockerfile
          push: true
          # Set the IMAGE_PLATFORMS repository variable to linux/arm64 if the
          # Coolify server is ARM. Building both under emulation is very slow.
          platforms: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runs only after the push above succeeded, so Coolify never pulls
      # before the new image exists. Auto-deploy must be off in Coolify.
      - name: Trigger the Coolify deployment
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "COOLIFY_WEBHOOK_URL or COOLIFY_TOKEN is not set; skipping the deployment."
            echo "The image was pushed. Deploy it from Coolify by hand, or add the secrets."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 \
            --request GET "$COOLIFY_WEBHOOK_URL" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
          echo
          echo "Coolify accepted the deployment request."
